<style>
  :root{
    --blue:#0b4a86;
    --gold:#e3a712;
    --slate:#232f3e;
    --bg:#ffffff;
    --surface:#f7f8fa;
    --surface2:#edeff2;
    --line:#e4e7eb;
    --text:#1c2430;
    --muted:#6b7280;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(20,30,50,.05), 0 1px 1px rgba(20,30,50,.03);
    --shadow-md:0 10px 30px -8px rgba(20,30,50,.14);
    --shadow-lg:0 24px 60px -12px rgba(20,30,50,.22);
    --ease:cubic-bezier(.22,.9,.3,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px;
    font-weight:400;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--gold);color:#111;}

  @keyframes fadeInUp{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0;transform:scale(.94);} to{opacity:1;transform:scale(1);} }
  @keyframes kenburns{ from{transform:scale(1);} to{transform:scale(1.07);} }
  @keyframes toastIn{ from{opacity:0;transform:translate(-50%,14px);} to{opacity:1;transform:translate(-50%,0);} }

  main{animation:fadeIn .45s var(--ease-out) both;}
  .poster-card, .snack-card, .tier-card{animation:fadeInUp .5s var(--ease-out) both; animation-delay:calc(var(--i,0) * 55ms);}
  .overlay-inner{animation:popIn .35s var(--ease-out) both;}
  .overlay{animation:fadeIn .25s ease both;}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .container{width:100%;max-width:1180px;margin:0 auto;padding:0 22px;}

  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);
    transition:box-shadow .25s var(--ease);
  }
  .nav.scrolled{box-shadow:0 1px 12px rgba(20,30,50,.06);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1180px;margin:0 auto;}

  .logo{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue';font-size:26px;letter-spacing:2px;color:var(--slate);transition:opacity .15s ease;}
  .logo:hover{opacity:.75;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .logo span{color:var(--blue);}
  .nav-links{display:flex;gap:4px;align-items:center;}
  .nav-btn{
    background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;
    font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;
    transition:background .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
  }
  .nav-btn:hover{color:var(--text);}
  .nav-btn:active{transform:scale(.95);}
  .nav-btn.active{background:var(--blue);color:#fff;}
  .nav-user{
    display:flex;align-items:center;gap:8px;background:var(--surface2);
    padding:6px 8px 6px 14px;border-radius:999px;font-size:13px;font-weight:700;
    border:1px solid var(--line);
  }
  .nav-user .lvl{background:var(--gold);color:#1a1200;padding:4px 10px;border-radius:999px;font-size:11px;}
  .icon-btn{width:30px;height:30px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s ease, transform .15s var(--ease);}
  .icon-btn:hover{background:var(--surface2);}
  .icon-btn:active{transform:scale(.9);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;border-radius:999px;font-weight:800;font-size:14px;
    letter-spacing:.3px;transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s ease, color .18s ease, border-color .18s ease;
  }
  .btn-gold{background:var(--gold);color:#1a1200;}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 24px -6px rgba(227,167,18,.45);}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-blue:hover{transform:translateY(-2px);box-shadow:0 10px 24px -6px rgba(11,74,134,.4);}
  .btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
  .btn-outline:hover{border-color:var(--blue);color:var(--blue);}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
  .btn-sm{padding:8px 16px;font-size:12px;}
  .btn-full{width:100%;}

  .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);font-weight:800;}
  .muted{color:var(--muted);}
  .section{padding:60px 0;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:box-shadow .25s var(--ease), transform .25s var(--ease);}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);border:1px solid var(--line);}

  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .status-por-pagar{background:#fff3cd;color:#856404;border:1px solid #ffeeba;}
  .status-no-pagado{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
  .status-pagado{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}

  .hero-carousel{position:relative;height:78vh;min-height:480px;overflow:hidden;}
  .hero-slide{
    position:absolute;inset:0;
    opacity:0;visibility:hidden;transition:opacity 1s var(--ease);display:flex;align-items:flex-end;overflow:hidden;
  }
  .hero-slide.active{opacity:1;visibility:visible;z-index:1;}
  .hero-bg{
    position:absolute;inset:0;background-size:cover;background-position:center;
    animation:kenburns 9s var(--ease) both;
  }
  .hero-slide::before{
    content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(0deg,#fff 2%, rgba(255,255,255,.6) 45%, rgba(255,255,255,.2) 100%),
               linear-gradient(90deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.1) 60%);
  }
  .hero-content{position:relative;z-index:2;padding:0 22px 46px;max-width:1180px;margin:0 auto;width:100%;color:#111;animation:fadeInUp .7s var(--ease-out) both;animation-delay:.15s;}
  .hero-title{font-size:clamp(38px,7vw,84px);line-height:.95;max-width:720px;color:var(--slate);}
  .hero-meta{display:flex;gap:10px;margin:14px 0 16px;flex-wrap:wrap;}
  .hero-syn{max-width:560px;color:#333;margin-bottom:22px;font-size:15px;line-height:1.55;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}

  .hero-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);
    border:1px solid var(--line);font-size:22px;line-height:1;color:var(--slate);
    display:flex;align-items:center;justify-content:center;transition:background .15s ease, transform .15s var(--ease);
  }
  .hero-nav:hover{background:#fff;}
  .hero-nav:active{transform:translateY(-50%) scale(.9);}
  .hero-nav.prev{left:16px;}
  .hero-nav.next{right:16px;}
  .hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;}
  .hero-dot{width:9px;height:9px;border-radius:50%;background:rgba(43,73,100,.3);border:none;padding:0;transition:.3s var(--ease);}
  .hero-dot.active{background:var(--gold);width:24px;border-radius:5px;}

  .marquee{padding:34px 0 10px;}
  .marquee-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .marquee-head h2{font-size:40px;color:var(--slate);}

  .poster-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;}
  .poster-card{cursor:pointer;position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .35s ease;}
  .poster-card:hover{transform:translateY(-6px);border-color:transparent;box-shadow:var(--shadow-md);}
  .poster-card .pimg img{transition:transform .5s var(--ease-out);}
  .poster-card:hover .pimg img{transform:scale(1.045);}
  .poster-card .pimg{aspect-ratio:2/3;overflow:hidden;background:#dee2e6;}
  .poster-card .pimg img{width:100%;height:100%;object-fit:cover;}
  .poster-card .pinfo{padding:14px;}
  .poster-card h3{font-size:20px;line-height:1.1;margin-bottom:6px;color:var(--slate);}
  .poster-card .lang{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;}
  .play-chip{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.9);color:var(--blue);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line);z-index:3;}

  .detail-banner{height:300px;background-size:cover;background-position:center;position:relative;background-color:#dee2e6;}
  .detail-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#fff 0%, rgba(255,255,255,.5) 60%, transparent 100%);}
  .detail-body{max-width:1180px;margin:-70px auto 0;padding:0 22px 40px;position:relative;z-index:2;}
  .detail-top{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;margin-bottom:30px;}
  .detail-poster{width:170px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 10px 25px rgba(0,0,0,.15);flex-shrink:0;background:#dee2e6;}
  .detail-poster img{width:100%;height:100%;object-fit:cover;}
  .detail-title-block h1{font-size:44px;color:var(--slate);}
  .detail-syn{max-width:640px;color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:8px;}

  .step-label{display:flex;align-items:center;gap:10px;margin:30px 0 16px;}
  .step-label .num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step-label h3{font-family:'Manrope';font-size:15px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--slate);}

  .date-row,.time-row{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{
    padding:12px 18px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);
    font-weight:800;font-size:13px;text-align:center;min-width:64px;transition:.15s ease;cursor:pointer;color:var(--slate);
  }
  .pill:hover{border-color:var(--blue);}
  .pill.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pill .d2{display:block;font-size:16px;font-family:'Bebas Neue';}

  .screen-wrap{text-align:center;margin:14px 0 26px;}
  .screen{
    width:100%;max-width:480px;height:8px;margin:0 auto 6px;border-radius:0 0 40px 40px/8px;
    background:linear-gradient(180deg, var(--blue), transparent);
    box-shadow:0 8px 20px -4px rgba(0,83,160,.4);
  }
  .screen-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
  .seat-map{display:flex;flex-direction:column;gap:10px;align-items:center;margin:20px 0;}
  .seat-row{display:flex;gap:10px;align-items:center;}
  .row-tag{width:20px;font-weight:800;color:var(--slate);font-size:14px;}
  .seat{
    width:38px;height:34px;border-radius:8px 8px 4px 4px;background:var(--surface2);
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--slate);transition:transform .2s var(--ease), background .2s ease, border-color .2s ease, box-shadow .2s ease;cursor:pointer;
  }
  .seat:hover{border-color:var(--blue);background:#fff;transform:translateY(-2px);}
  .seat.selected{background:var(--gold);border-color:var(--gold);color:#1a1200;transform:scale(1.08);box-shadow:0 6px 14px -4px rgba(227,167,18,.5);}
  .legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;}
  .legend-swatch{width:16px;height:14px;border-radius:4px;background:var(--surface2);border:1.5px solid var(--line);}
  .legend-swatch.sel{background:var(--gold);border-color:var(--gold);}

  .action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}

  .snack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px;}
  .snack-card{padding:20px;}
  .snack-card h3{font-size:22px;margin-bottom:4px;color:var(--slate);}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:12px 0 6px;}
  select, input[type=text], input[type=email], input[type=date], input[type=password], textarea{
    width:100%;background:#fff;border:1.5px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 12px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--slate);}
  .chip input{accent-color:var(--blue);}
  .qty-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .qty-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);color:var(--slate);font-size:16px;font-weight:800;cursor:pointer;}
  .price-tag{font-family:'Bebas Neue';font-size:22px;color:var(--blue);}

  .order-panel{position:sticky;top:90px;}
  .order-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .order-item:last-child{border-bottom:none;}
  .order-item .oi-name{font-weight:700;color:var(--slate);}
  .order-item .oi-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .order-total-row{display:flex;justify-content:space-between;padding-top:14px;margin-top:8px;border-top:2px solid var(--line);font-family:'Bebas Neue';font-size:24px;color:var(--slate);}
  .rm-btn{background:transparent;color:#dc3545;font-size:11px;font-weight:800;cursor:pointer;padding:0;}

  .ticket{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;
    box-shadow:var(--shadow-md);
  }
  .ticket-pop{animation:popIn .5s var(--ease-out) both;}
  .ticket-divider{position:relative;margin:18px -26px;border-top:2px dashed var(--line);}
  .ticket-divider::before, .ticket-divider::after{
    content:'';position:absolute;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;background:#fff;
  }
  .ticket-divider::before{left:-12px;}
  .ticket-divider::after{right:-12px;}

  .pago-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:start;}
  .pago-card{padding:26px;}
  .pay-method{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
  .pay-opt{flex:1;min-width:140px;padding:16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:var(--slate);transition:border-color .2s ease, background .2s ease, transform .15s var(--ease);}
  .pay-opt:not(.disabled):hover{border-color:var(--blue);transform:translateY(-1px);}
  .pay-opt.selected{border-color:var(--blue);background:rgba(0,83,160,.08);color:var(--blue);}
  .pay-opt.disabled{opacity:.4;cursor:not-allowed;}
  .tab-row{display:flex;gap:10px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:12px;border-radius:10px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:13px;cursor:pointer;color:var(--slate);transition:background .2s ease, color .2s ease, border-color .2s ease;}
  .tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .qr{width:150px;height:150px;margin:0 auto;border-radius:10px;background:#fff;padding:8px;border:1px solid var(--line);}

  .pronto-card{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:24px;align-items:center;}
  @media(max-width:640px){.pronto-card{grid-template-columns:1fr;}}

  .tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px;}
  .tier-card{padding:22px;border-top:4px solid var(--slate);cursor:pointer;transition:transform .25s var(--ease), box-shadow .25s var(--ease);}
  .tier-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
  .tier-card.star{border-top-color:#adb5bd;}
  .tier-card.planet{border-top-color:var(--blue);}
  .tier-card.galaxy{border-top-color:var(--gold);}
  .tier-card h3{font-size:26px;margin-bottom:4px;color:var(--slate);}
  .tier-card ul{padding-left:18px;margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.9;}

  .member-card{
    max-width:420px;border-radius:18px;padding:26px;position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--slate), #18283b);
    border:1px solid var(--line); color:#fff;
  }
  .member-card .lvltag{font-family:'Bebas Neue';font-size:26px;color:var(--gold);letter-spacing:2px;}
  .member-card .cname{font-size:20px;font-weight:800;margin-top:16px;}
  .member-card .cmeta{color:#adb5bd;font-size:12px;margin-top:4px;}
  .member-card .pts{font-family:'Bebas Neue';font-size:46px;margin-top:14px;color:#fff;}

  footer{margin-top:auto;border-top:1px solid var(--line);background:var(--surface);padding:50px 0 26px;}

  .toast{
    position:fixed;bottom:26px;left:50%;background:var(--slate);
    border:1px solid var(--gold);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;font-size:13px;
    z-index:200;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
    animation:toastIn .4s var(--ease-out) both;transition:opacity .3s ease, transform .3s var(--ease);
  }
  .toast.toast-out{opacity:0;transform:translate(-50%,10px);}

  .seat.taken{background:#e9ecef;color:#adb5bd;border-style:dashed;cursor:not-allowed;}
  .seat.taken:hover{border-color:var(--line);background:#e9ecef;transform:none;}
  .legend-swatch.taken{background:#e9ecef;border-style:dashed;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-zone"></div>

<script>
const MOVIES = [
  {
    id:'backrooms',
    title:'Backrooms: Sin Salida',

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function toast(msg){
  const zone = document.getElementById('toast-zone');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = '✅ '+msg;
  zone.appendChild(el);
  setTimeout(()=>{
    el.classList.add('toast-out');
    setTimeout(()=>el.remove(), 320);
  }, 3200);
}

  if(takenSeatsForCurrentShow().includes(id)) return;
  const idx = S.selectedSeats.indexOf(id);
  if(idx>-1) S.selectedSeats.splice(idx,1); else S.selectedSeats.push(id);
  render();
}

  const size = document.getElementById('size-'+cat).value;
  const qty = parseInt(document.getElementById('qty-'+cat).value||'1',10);
  const price = cfg.sizes[size];
  S.snackCart.push({ id: Date.now()+Math.random(), label: `${cfg.label} (${flavor})`, detail: `Tamaño ${size}`, price, qty });
  toast(`${cfg.label} agregado a tu orden`);
  render();

function qtyStepper(id){
  return `
  <div class="qty-row">

    <input type="text" id="${id}" value="1" readonly style="width:40px;text-align:center;border:none;background:transparent;font-weight:800;">

  const el = document.getElementById(id);

  el.value = v;
}

function placeOrder(){
  if(_placingOrder) return;
  let name, email;
  const u = currentUser();
  if(u){ name = u.name; email = u.email; } 
  else {
    name = document.getElementById('guest-name')?.value.trim();
    email = document.getElementById('guest-email')?.value.trim();
    if(!name || !email){ toast('⚠️ Ingresa tu nombre y correo electrónico'); return; }
    if(!isValidEmail(email)){ toast('⚠️ Ingresa un correo electrónico válido'); return; }
  }
  _placingOrder = true;

  const items = [];
  if(S.activeMovie && S.selectedDate && S.selectedTime && S.selectedSeats.length){
    items.push(`${S.activeMovie.title} — ${S.selectedDate}, ${S.selectedTime}, Butacas: ${S.selectedSeats.join(', ')}`);
    const key = showKey(S.activeMovie, S.selectedDate, S.selectedTime);
    S.takenSeats[key] = (S.takenSeats[key] || []).concat(S.selectedSeats);
  }
  S.snackCart.forEach(i=> items.push(`${esc(i.label)} ×${i.qty} (${esc(i.detail)})`));

  const total = orderTotal();
  const code = 'SC-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const ticket = { code, name, email, items, total, date: new Date().toLocaleString('es-MX'), payMethod: S.payMethod, movie: S.activeMovie, status: 'por pagar' };
  S.lastTicket = ticket;

  if(u && !u.isStaff){
    u.purchases.push(ticket);
    const t = tierInfo(u.purchases.length);
    u.points += Math.floor(total / t.divisor);
  } else {
    S.guestPurchases.push(ticket);
  }

  // ENVÍO DE CORREO USANDO TUS CREDENCIALES CONFIGURADAS DE EMAILJS
  const templateParams = {
    name: name,
    email: email,
    order_id: code,
    name_pelicula: S.activeMovie ? S.activeMovie.title : 'Artículos de Dulcería / Varios',
    funcion_horario: S.activeMovie && S.selectedDate && S.selectedTime ? `${S.selectedDate} - ${S.selectedTime}` : 'N/A',
    asientos: S.selectedSeats.length ? S.selectedSeats.join(', ') : 'N/A',
    poster_url: S.activeMovie ? S.activeMovie.poster : 'https://image.tmdb.org/t/p/original/iJUV9QS4L9wS7WTV7ICV1TWUB1X.jpg',
    units: S.selectedSeats.length ? S.selectedSeats.length : '1',
    price: total.toFixed(2)
  };

  emailjs.send("service_jk76uvi$", "template_eisldou", templateParams)
    .then(function(response) {
       console.log('SUCCESS!', response.status, response.text);
       toast('Correo enviado con éxito. Boleto disponible en Rewards.');
    }, function(error) {
       console.log('FAILED...', error);
       toast('⚠️ Error al enviar el correo automático, pero tu orden ha sido registrada.');
    });

  S.activeMovie=null; S.selectedDate=null; S.selectedTime=null; S.selectedSeats=[]; S.snackCart=[];
  S.view='ticket';
  render(); window.scrollTo(0,0);
}

function isValidEmail(email){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

function registerUser(){
  const name = document.getElementById('reg-name').value.trim();
  const bday = document.getElementById('reg-bday').value;
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass = document.getElementById('reg-pass').value;
  const phone = document.getElementById('reg-phone').value.trim();
  const gender = document.getElementById('reg-gender').value;

  if(!name||!bday||!email||!pass||!phone||!gender){ toast('⚠️ Completa todos los campos'); return; }
  if(!isValidEmail(email)){ toast('⚠️ Ingresa un correo válido'); return; }
  if(pass.length < 6){ toast('⚠️ La contraseña debe tener al menos 6 caracteres'); return; }
  if(S.accounts[email]){ toast('⚠️ Ya existe una cuenta con este correo'); return; }
  
  const dObj = new Date();
  const yy = String(dObj.getFullYear()).slice(2);
  const mm = String(dObj.getMonth()+1).padStart(2,'0');
  const dd = String(dObj.getDate()).padStart(2,'0');
  const initials = name.replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase();
  const accountNo = yy + mm + dd + initials + 'SC';

  S.accounts[email] = { name, birthdate:bday, email, phone, gender, password: pass, accountNo, purchases: S.guestPurchases.slice(), points: 0, isStaff: false };
  S.guestPurchases = [];
  S.currentUserEmail = email;
  toast('¡Tarjeta digital generada con éxito! 🌟');
  render();
}

function toggleExpandTicket(code){
  S.expandedTicketCode = S.expandedTicketCode === code ? null : code;
  render();
}

function toggleTierModal(key){
  S.expandedTierModal = S.expandedTierModal === key ? null : key;
  render();
}

function updateTicketStatus(code, newStatus){
  if(S.lastTicket && S.lastTicket.code.toLowerCase() === code.toLowerCase()) S.lastTicket.status = newStatus;
  for(const accKey in S.accounts){
    const found = S.accounts[accKey].purchases.find(p => p.code.toLowerCase() === code.toLowerCase());
    if(found){ found.status = newStatus; break; }
  }
  const foundGuest = S.guestPurchases.find(p => p.code.toLowerCase() === code.toLowerCase());
  if(foundGuest) foundGuest.status = newStatus;

  toast(`Estatus actualizado a: ${newStatus.toUpperCase()}`);
  render();
}

let html5QrCodeScannerInstance = null;
function startScanner(){
  S.scannerActive = true;
  S.scanResult = null;
  render();
  setTimeout(() => {
    try {
      html5QrCodeScannerInstance = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
      html5QrCodeScannerInstance.render((text)=>{
        S.scanResult = text;
        toast(`¡Boleto escaneado con éxito!`);
        stopScanner();
      }, ()=>{});
    } catch(e){ console.error(e); }
  }, 150);
}

function stopScanner(){
  if(html5QrCodeScannerInstance){
    html5QrCodeScannerInstance.clear().catch(e => console.error(e));
    html5QrCodeScannerInstance = null;
  }
  S.scannerActive = false;
  render();
}

            ${t.movie ? `<div style="display:flex;gap:12px;margin-bottom:10px;align-items:center;"><img src="${t.movie.poster}" style="width:50px;border-radius:6px;" onerror="onImgErr(this)"><b style="color:var(--slate);">${t.movie.title}</b></div>` : ''}

      </div>`;
  }).join('');
}

  $app.innerHTML = `
    ${renderNav()}
    <main>${content}</main>
    <footer>
      <div class="container" style="text-align:center;color:var(--muted);font-size:13px;">
        © Star Cinema MX — Orgullosamente una compañía mexicana.

}
